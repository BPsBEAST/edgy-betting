name: Refresh fixtures and publish EDGY Betting

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/**'
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edgy-betting-deploy
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test probability engine and check source syntax
        run: |
          node --check app.js
          node --check src/engine.js
          python -m py_compile scripts/sync_fixtures.py
          npm test
      - name: Fetch actual football fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/sync_fixtures.py
      - name: Commit updated public fixture cache
        run: |
          if ! git diff --quiet -- data/fixtures.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fixtures.json
            git commit -m "data: refresh verified football fixtures [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload website
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
