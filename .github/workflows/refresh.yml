name: Refresh fixtures and publish EDGY Betting

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/**'
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edgy-betting-deploy
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test probability engine and check source syntax
        run: |
          node --check app.js
          node --check src/engine.js
          node --check src/radar.js
          python -m py_compile scripts/sync_fixtures.py scripts/sync_analysis.py scripts/sync_odds.py scripts/link_odds.py scripts/sync_context.py scripts/sync_free_predictions.py
          npm test
          python -m unittest discover -s tests -p "test_*.py"
      - name: Fetch actual football fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # The current free plan denies fixtures from season 2026/27.
          # Leave off instead of spending 24 denied requests/day.
          # Paid/current-season plans may set this value to 6-12.
          API_FOOTBALL_FIXTURE_MAX_LEAGUES: "0"
        run: python scripts/sync_fixtures.py
      - name: Build automatic match projections from published season results
        run: python scripts/sync_analysis.py
      - name: Collect optional free third-party forecasts (no API keys)
        run: python scripts/sync_free_predictions.py
      - name: Load reference odds where API-Football is configured
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_ODDS_DAYS: "2"
          API_FOOTBALL_ODDS_MAX_PAGES: "2"
        run: python scripts/sync_odds.py
      - name: Match odds by supported metadata (free plan; no API requests)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/link_odds.py
      - name: Collect licensed match context and verified venue-city forecasts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_CONTEXT_CALL_LIMIT: '4'
        run: python scripts/sync_context.py
      - name: Build mobile icons from the existing logo
        run: |
          python -m pip install --quiet cairosvg
          python scripts/build_icons.py
      - name: Commit public data snapshots
        run: |
          git add data/ assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update fixtures and automatic previews [skip ci]"
            # New code commits may land during the sync; rebase only the data commit.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Prepare safe static site
        if: steps.pages_setup.outcome == 'success'
        run: |
          mkdir -p ./site/src ./site/data
          cp index.html styles.css app.js manifest.webmanifest sw.js ./site/
          cp src/engine.js src/radar.js ./site/src/
          cp data/fixtures.json data/analysis.json data/market_odds.json data/context.json data/free_predictions.json ./site/data/
          mkdir -p ./site/assets
          cp assets/edgy-mark.svg assets/edgy-icon-180.png assets/edgy-icon-192.png assets/edgy-icon-512.png ./site/assets/
          touch ./site/.nojekyll
      - name: Upload website
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish website
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
